%YAML 1.2
---
$id: http://devicetree.org/schemas/input/cirrus,cs40l26.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cirrus Logic CS40L26 Boosted Haptic Driver

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The CS40L26 drives a linear resonant actuator (LRA) from a boost converter
  and a class-D amplifier under the control of an integrated Halo Core DSP,
  which runs a ROM firmware out of reset and a RAM firmware loaded by the
  host. It is controlled over I2C.

properties:
  compatible:
    enum:
      - cirrus,cs40l26a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-a-supply:
    description: Power supply for internal analog circuits.

  vdd-p-supply:
    description: Power supply for the amplifier and the boost converter input.

  cirrus,boost-peak-microamp:
    description: Peak current limit of the boost inductor.
    minimum: 800000
    maximum: 4800000
    multipleOf: 50000
    default: 4500000

  cirrus,boost-ctl-microvolt:
    description: Maximum boost converter output voltage.
    minimum: 2500000
    maximum: 11000000
    multipleOf: 50000
    default: 11000000

  cirrus,vpbr-threshold-microvolt:
    description:
      Enable hardware attenuation when the amplifier and boost input supply
      falls below this voltage. The attack, hold and release policy uses the
      Cirrus default settings. If absent, leave VP brownout prevention unchanged.
    minimum: 2497000
    maximum: 3874000
    multipleOf: 47000

  cirrus,lra-f0-hz:
    description: Nominal resonant frequency of the actuator.
    minimum: 50
    maximum: 500

  cirrus,lra-redc-micro-ohms:
    description: Nominal DC resistance of the actuator.
    maximum: 255000000

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      haptic-driver@43 {
        compatible = "cirrus,cs40l26a";
        reg = <0x43>;
        interrupt-parent = <&gpio>;
        interrupts = <1 IRQ_TYPE_LEVEL_LOW>;
        reset-gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
        cirrus,boost-peak-microamp = <2500000>;
        cirrus,boost-ctl-microvolt = <11000000>;
        cirrus,lra-f0-hz = <145>;
        cirrus,lra-redc-micro-ohms = <13000000>;
      };
    };
