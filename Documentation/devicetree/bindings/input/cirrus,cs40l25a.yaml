%YAML 1.2
---
$id: http://devicetree.org/schemas/input/cirrus,cs40l25a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cirrus Logic CS40L25A boosted haptic driver

maintainers:
  - saiththerobo <the.tom.sharp@gmail.com>

description:
  The CS40L25A is a boosted class-D amplifier with a Halo Core DSP that
  drives a linear resonant actuator, controlled over I2C. It boots from
  ROM into a basic mode; the host loads its RAM firmware and plays
  effects through the firmware's mailbox.

properties:
  compatible:
    const: cirrus,cs40l25a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: The chip's active-low RESET line; asserted holds it in reset.

  cirrus,boost-peak-microamp:
    description: Peak current limit of the boost inductor.
    minimum: 1600000
    maximum: 4500000
    multipleOf: 50000
    default: 4500000

  cirrus,boost-ctl-microvolt:
    description: Maximum boost converter output voltage.
    minimum: 2550000
    maximum: 11000000
    multipleOf: 50000
    default: 11000000

required:
  - compatible
  - reg
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        haptics@43 {
            compatible = "cirrus,cs40l25a";
            reg = <0x43>;
            reset-gpios = <&gpio 0 GPIO_ACTIVE_LOW>;
            cirrus,boost-peak-microamp = <4500000>;
            cirrus,boost-ctl-microvolt = <7500000>;
        };
    };
