%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/samsung,s6sy761.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6SY761 and S6SY79x touchscreen controllers

description:
  The S6SY761 is connected over I2C. The S6SY79x speaks the same command
  set over SPI, with Samsung's framing.

maintainers:
  - Andi Shyti <andi.shyti@kernel.org>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - samsung,s6sy761
      - samsung,s6sy79x

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  spi-cpha: true
  spi-cpol: true

  avdd-supply: true
  vdd-supply: true

unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - avdd-supply
  - vdd-supply

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@48 {
            compatible = "samsung,s6sy761";
            reg = <0x48>;
            interrupt-parent = <&gpa1>;
            interrupts = <1 IRQ_TYPE_LEVEL_HIGH>;
            avdd-supply = <&ldo30_reg>;
            vdd-supply = <&ldo31_reg>;
            touchscreen-size-x = <4096>;
            touchscreen-size-y = <4096>;
        };
    };
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "samsung,s6sy79x";
            reg = <0>;
            spi-max-frequency = <10000000>;
            spi-cpol;
            spi-cpha;
            interrupt-parent = <&gpa9>;
            interrupts = <0 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&gpp26 0 GPIO_ACTIVE_LOW>;
            avdd-supply = <&ldo26m>;
            vdd-supply = <&ldo25m>;
            touchscreen-size-x = <1440>;
            touchscreen-size-y = <3120>;
        };
    };
