%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft3658.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FocalTech FT3658 SPI touch controller

maintainers:
  - Alejandro Garcia <skipper.pelygro@gmail.com>

description:
  FocalTech FT3658 capacitive touch controller on SPI, as in the Google
  Pixel 7. The controller runs its firmware from its own flash and reports
  up to ten touches. The I2C FocalTech controllers are covered by
  edt-ft5x06.yaml and are different devices.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: focaltech,ft3658

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Digital supply (1.8 V)

  avdd-supply:
    description: Analog supply

  reset-gpios:
    description: Active-low reset
    maxItems: 1

  spi-max-frequency: true

required:
  - compatible
  - reg
  - interrupts
  - vdd-supply
  - avdd-supply
  - reset-gpios
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "focaltech,ft3658";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupt-parent = <&gpa7>;
            interrupts = <0 IRQ_TYPE_EDGE_FALLING>;
            vdd-supply = <&ldo25m>;
            avdd-supply = <&ldo26m>;
            reset-gpios = <&gpp23 2 GPIO_ACTIVE_LOW>;
            touchscreen-size-x = <1080>;
            touchscreen-size-y = <2400>;
        };
    };
