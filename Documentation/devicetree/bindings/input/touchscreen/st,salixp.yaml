%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/st,salixp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics SALIXP SPI touch controller

maintainers:
  - David A. Buser <code@booze.dog>

description:
  STMicroelectronics SALIXP touch controller on SPI. SALIXP is the FTS
  part whose chip id is 36 40. The binding covers the chip-id read. It
  does not describe firmware loading or touch reports. The I2C FingerTip
  controller is st,stmfts and is a different device.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: st,salixp

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply: true

  avdd-supply: true

  reset-gpios:
    description: Active-low reset
    maxItems: 1

  spi-max-frequency: true

required:
  - compatible
  - reg
  - interrupts
  - vdd-supply
  - avdd-supply
  - reset-gpios
  - spi-max-frequency

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "st,salixp";
            reg = <0>;
            spi-max-frequency = <10000000>;
            interrupt-parent = <&gpa6>;
            interrupts = <7 IRQ_TYPE_LEVEL_LOW>;
            vdd-supply = <&ldo25m>;
            avdd-supply = <&ldo26m>;
            reset-gpios = <&gpp23 3 GPIO_ACTIVE_LOW>;
        };
    };
