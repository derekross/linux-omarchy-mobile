%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/google/google,gs201-aoc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor AoC (Always-on Compute)

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The AoC is the audio and sensor DSP of Tensor SoCs. The AP loads its
  firmware into a reserved carve-out and the GSA authenticates and starts
  it. On gs201 the AoC reaches memory through its own System MMU, which
  Linux sets up. On zumapro (Tensor G4) the authenticated firmware owns
  the AoC's memory protection, so Linux touches neither its S2MPU nor its
  System MMU.

properties:
  compatible:
    enum:
      - google,gs201-aoc
      - google,zumapro-aoc

  reg:
    minItems: 2
    maxItems: 4

  reg-names:
    minItems: 2
    maxItems: 4

  clocks:
    description: the ACPM DVFS domains whose rates are read before each
      firmware start
    minItems: 1
    maxItems: 17

  firmware-name:
    maxItems: 1
    description: the signed AoC firmware image

  sensor-1v8-supply:
    description: the sensors' 1.8 V, turned on before the 3.3 V

  sensor-3v3-supply:
    description: the sensors' 3.3 V, turned off before the 1.8 V

  interrupts:
    maxItems: 1

  mboxes:
    description: the 48 doorbell channels of the three AoC mailboxes (A32,
      F1, P6), 16 each, in that order
    maxItems: 48

  interrupt-names:
    items:
      - const: watchdog

  memory-region:
    maxItems: 1
    description: the carve-out the firmware runs from

  google,gsa:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: the GSA that authenticates and starts the firmware

  google,sysmmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: the AoC's System MMU

  google,board-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: board id passed to the firmware

  google,board-rev:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: board revision passed to the firmware

  google,gnss-type:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: the board's GNSS receiver, passed to the firmware
      (kAOCGnssType)

required:
  - compatible
  - reg
  - reg-names
  - memory-region
  - google,gsa
  - google,board-id
  - google,board-rev

allOf:
  - if:
      properties:
        compatible:
          const: google,zumapro-aoc
    then:
      properties:
        reg:
          items:
            - description: the AoC power request register (aoc_req) and its
                acknowledge at +0x40
            - description: the chip id block, read for the firmware's boot
                parameters
        reg-names:
          items:
            - const: aoc_req
            - const: chipid
        mboxes:
          minItems: 48
        google,sysmmu: false
      required:
        - firmware-name
        - interrupts
        - interrupt-names
        - mboxes
        - sensor-1v8-supply
        - sensor-3v3-supply
    else:
      properties:
        reg:
          minItems: 3
          items:
            - description: the AoC power request register (aoc_req) and its
                acknowledge at +0x40
            - description: the AoC's stage-2 MPU
            - description: the chip id block, read for the firmware's boot
                parameters
            - description: the AoC power control unit (A32 reset control and
                revision), in the AoC block
        reg-names:
          minItems: 3
          items:
            - const: aoc_req
            - const: s2mpu
            - const: chipid
            - const: pcu
        clocks: false
        sensor-1v8-supply: false
        sensor-3v3-supply: false
      required:
        - google,sysmmu

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    aoc@181d0000 {
        compatible = "google,gs201-aoc";
        reg = <0x181d0000 0x1000>, <0x1a0b0000 0x1000>, <0x10000000 0x100>,
              <0x19a00000 0x10000>;
        reg-names = "aoc_req", "s2mpu", "chipid", "pcu";
        interrupts = <GIC_SPI 116 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "watchdog";
        memory-region = <&aoc_carveout>;
        google,gsa = <&gsa>;
        google,sysmmu = <&aoc_sysmmu>;
        google,board-id = <0x30301>;
        google,board-rev = <0x10000>;
    };
