%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/google/google,gs201-aoc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 AoC (Always-on Compute)

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The AoC is the audio and sensor DSP of gs201. The AP loads its firmware
  into a reserved carve-out, the GSA authenticates and starts it, and the
  AoC reaches memory through its own System MMU.

properties:
  compatible:
    const: google,gs201-aoc

  reg:
    minItems: 3
    items:
      - description: the AoC power request register (aoc_req) and its
          acknowledge at +0x40
      - description: the AoC's stage-2 MPU
      - description: the chip id block, read for the firmware's boot
          parameters
      - description: the AoC power control unit (A32 reset control and
          revision), in the AoC block
      - description: the AoC A32 to AP mailbox
      - description: the AoC F1 to AP mailbox
      - description: the AoC P6 to AP mailbox

  reg-names:
    minItems: 3
    items:
      - const: aoc_req
      - const: s2mpu
      - const: chipid
      - const: pcu
      - const: mbox-a32
      - const: mbox-f1
      - const: mbox-p6

  interrupts:
    maxItems: 1

  interrupt-names:
    items:
      - const: watchdog

  memory-region:
    maxItems: 1
    description: the carve-out the firmware runs from

  google,gsa:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: the GSA that authenticates and starts the firmware

  google,sysmmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: the AoC's System MMU

  google,board-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: board id passed to the firmware

  google,board-rev:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: board revision passed to the firmware

required:
  - compatible
  - reg
  - reg-names
  - memory-region
  - google,gsa
  - google,sysmmu
  - google,board-id
  - google,board-rev

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    aoc@181d0000 {
        compatible = "google,gs201-aoc";
        reg = <0x181d0000 0x1000>, <0x1a0b0000 0x1000>, <0x10000000 0x100>,
              <0x19a00000 0x10000>;
        reg-names = "aoc_req", "s2mpu", "chipid", "pcu";
        interrupts = <GIC_SPI 116 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "watchdog";
        memory-region = <&aoc_carveout>;
        google,gsa = <&gsa>;
        google,sysmmu = <&aoc_sysmmu>;
        google,board-id = <0x30301>;
        google,board-rev = <0x10000>;
    };
