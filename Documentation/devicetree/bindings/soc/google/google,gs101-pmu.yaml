%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/google/google,gs101-pmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google GS101 Power Management Unit (PMU)

maintainers:
  - André Draszik <andre.draszik@linaro.org>

properties:
  compatible:
    oneOf:
      - const: google,gs101-pmu
      - items:
          - const: google,gs201-pmu
          - const: google,gs101-pmu

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

  reboot-mode:
    $ref: /schemas/power/reset/syscon-reboot-mode.yaml
    type: object
    description:
      Reboot mode to alter bootloader behavior for the next boot
    patternProperties:
      # Negative look-ahead to disallow unsupported modes. The '$' has to be
      # part of lookahead group to work, instead of trailing outside of ().
      "^mode-(?!(bootloader$|charge$|dm-verity-device-corrupted$|fastboot$|reboot-ab-update$|recovery$)|rescue$|shutdown-thermal$|shutdown-thermal-battery$)": false

  syscon-poweroff:
    $ref: /schemas/power/reset/syscon-poweroff.yaml#
    type: object
    description:
      Node for power off method

  syscon-reboot:
    $ref: /schemas/power/reset/syscon-reboot.yaml#
    type: object
    description:
      Node for reboot method

  google,pmu-intr-gen-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to PMU interrupt generation interface.

patternProperties:
  "^power-domain@[0-9a-f]+$":
    type: object
    description: Child node describing one power domain within the PMU

    additionalProperties: true

    properties:
      compatible:
        const: google,gs101-pd

required:
  - compatible
  - reg
  - google,pmu-intr-gen-syscon

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: google,gs201-pmu
    else:
      required:
        - "#address-cells"
        - "#size-cells"
        - ranges

additionalProperties: false

examples:
  - |
    system-controller@17460000 {
        compatible = "google,gs101-pmu";
        reg = <0x17460000 0x10000>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x17460000 0x10000>;

        google,pmu-intr-gen-syscon = <&pmu_intr_gen>;

        pd_g3d: power-domain@1e00 {
            compatible = "google,gs101-pd";
            reg = <0x1e00 0x80>;
            #power-domain-cells = <0>;
            label = "g3d";
            samsung,dtzpc = <&pd_g3d>;
        };

        power-domain@2000 {
            compatible = "google,gs101-pd";
            reg = <0x2000 0x80>;
            #power-domain-cells = <0>;
            power-domains = <&pd_g3d>;
            label = "embedded_g3d";
        };
    };
