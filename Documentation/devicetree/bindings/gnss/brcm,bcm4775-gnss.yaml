%YAML 1.2
---
$id: http://devicetree.org/schemas/gnss/brcm,bcm4775-gnss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM4775x GNSS receiver on SPI

maintainers:
  - Derek Ross <derekross@gmail.com>

description: |
  The Broadcom BCM4775x family of GNSS receivers (BCM4775, BCM4776, ...) as
  used in Google's Pixel 7 phones. The host talks to it over SPI with
  Broadcom's SSI framing. Besides the bus, the chip has a standby line, a
  request/response pair for waking its MCU, and a "host request" line it
  raises when it has data.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: brcm,bcm4775-gnss

  reg:
    maxItems: 1

  spi-max-frequency: true
  spi-cpol: true
  spi-cpha: true

  interrupts:
    maxItems: 1
    description: The host request line, level high.

  nstandby-gpios:
    maxItems: 1
    description: Standby control; the chip runs while the line is high.

  mcu-req-gpios:
    maxItems: 1
    description: Host to chip wake request.

  mcu-resp-gpios:
    maxItems: 1
    description: Chip to host answer to the wake request.

  host-req-gpios:
    maxItems: 1
    description: Chip to host data request (also the interrupt).

  vddcore-supply:
    description: Digital core supply.

  vddrf-supply:
    description: RF supply.

  vddaux-supply:
    description: Auxiliary (I/O) supply.

required:
  - compatible
  - reg
  - nstandby-gpios
  - mcu-req-gpios
  - mcu-resp-gpios
  - host-req-gpios
  - vddcore-supply
  - vddrf-supply
  - vddaux-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        gnss@0 {
            compatible = "brcm,bcm4775-gnss";
            reg = <0>;
            spi-max-frequency = <26000000>;
            spi-cpol;
            spi-cpha;
            interrupts-extended = <&gpa6 4 IRQ_TYPE_LEVEL_HIGH>;
            nstandby-gpios = <&gph2 3 GPIO_ACTIVE_HIGH>;
            mcu-req-gpios = <&gpp4 3 GPIO_ACTIVE_HIGH>;
            mcu-resp-gpios = <&gph2 2 GPIO_ACTIVE_HIGH>;
            host-req-gpios = <&gpa6 4 GPIO_ACTIVE_HIGH>;
            vddcore-supply = <&ldo9s>;
            vddrf-supply = <&ldo10s>;
            vddaux-supply = <&ldo11s>;
        };
    };
