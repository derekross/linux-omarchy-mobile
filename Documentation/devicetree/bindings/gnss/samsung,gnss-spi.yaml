%YAML 1.2
---
$id: http://devicetree.org/schemas/gnss/samsung,gnss-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Kepler GNSS core, SPI data link

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  Samsung's Kepler GNSS core is part of the S5300 modem in the Google
  Pixel 9a. It runs firmware that the host loads into the modem's shared
  memory, and it exchanges its data with the host over an SPI bus of the
  application processor (USI3 of HSI0 on Tensor G4), in blocks of 64
  bytes. The core and its supplies belong to the modem; this node is only
  the SPI device. The two lines that pace the transfers are described by
  a samsung,exynos-gnss node.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: samsung,gnss-spi

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        gnss@0 {
            compatible = "samsung,gnss-spi";
            reg = <0>;
            spi-max-frequency = <3125000>;

            controller-data {
                samsung,spi-feedback-delay = <0>;
            };
        };
    };
