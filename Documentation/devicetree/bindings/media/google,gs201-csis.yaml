%YAML 1.2
---
$id: http://devicetree.org/schemas/media/google,gs201-csis.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 and zumapro CSIS camera receiver link and CSIS WDMA

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The camera block of Google's gs201 SoC has eight MIPI CSI-2 receiver links
  (CSIS) and a DMA block whose CSIS WDMA contexts write a link's frames to
  memory. One node describes one link and the WDMA context it feeds.
  zumapro (Tensor G4) has the same receiver link in its ISP front end, with
  twelve link contexts; its DMA path is different and not described here.

properties:
  compatible:
    enum:
      - google,gs201-csis
      - google,zumapro-csis

  reg:
    minItems: 1
    maxItems: 4

  reg-names:
    minItems: 1
    maxItems: 4

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    maxItems: 2

  clocks:
    maxItems: 2

  clock-names:
    maxItems: 2

  phys:
    maxItems: 1
    description: The link's DC-PHY receiver.

  google,csis-link:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 11
    description: Index of the CSIS link (0-7 on gs201).

  google,wdma-context:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 3
    description: Index of the CSIS WDMA context.

  google,csis-sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The camera block's system registers, which route a link through an
      EBUF to a WDMA context.

  google,ebuf:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 3
    description:
      WDMA input slot the link is routed to; defaults to the context index.

  google,image-loch:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 6
    description:
      zumapro only. The CSIS core's image logical channel the link writes
      its frames through; defaults to 0.

  google,lrte-packet-delimiters:
    type: boolean
    description:
      The sensor ends its C-PHY packets with LRTE packet delimiters (EPD),
      which the link must be told to expect; without it, such a link
      decodes frame starts and nothing else.

  memory-region:
    maxItems: 1
    description: Pool for capture buffers the WDMA can address.

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    description: Input port, connected to the sensor.

    properties:
      endpoint:
        $ref: video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          bus-type:
            enum:
              - 1 # MEDIA_BUS_TYPE_CSI2_CPHY
              - 4 # MEDIA_BUS_TYPE_CSI2_DPHY
            description:
              D-PHY when absent. C-PHY counts trios in data-lanes (up to
              three on links 0 and 1, two on the others).
          data-lanes:
            minItems: 1
            maxItems: 4

        required:
          - data-lanes

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - phys
  - google,csis-link
  - port

allOf:
  - if:
      properties:
        compatible:
          const: google,gs201-csis
    then:
      properties:
        reg:
          minItems: 3
          items:
            - description: the CSIS link registers
            - description: the CSIS DMA block's common page (shared by all links)
            - description: the CSIS WDMA context (links may share one; they
                then stream one at a time)
            - description: the EBUF control (shared by all links), bypassed on
                the way to the WDMA
        reg-names:
          minItems: 3
          items:
            - const: link
            - const: dma
            - const: wdma
            - const: ebuf
        interrupts:
          items:
            - description: link interrupt
            - description: WDMA context interrupt
        interrupt-names:
          items:
            - const: link
            - const: wdma
        clocks:
          items:
            - description: the camera block's DVFS domain
            - description: the bus (INT) DVFS domain
        clock-names:
          items:
            - const: cam
            - const: int
        google,csis-link:
          maximum: 7
        google,image-loch: false
      required:
        - google,wdma-context
        - google,csis-sysreg
    else:
      properties:
        reg:
          minItems: 1
          items:
            - description: the CSIS link registers
            - description: the ISP front end's CSIS core page, shared by all
                links; without it the link runs without DMA
        reg-names:
          minItems: 1
          items:
            - const: link
            - const: core
        interrupts:
          minItems: 1
          items:
            - description: link interrupt
            - description: CSIS core interrupt, shared by all links
        interrupt-names:
          minItems: 1
          items:
            - const: link
            - const: core
        clocks:
          items:
            - description: the INT DVFS domain, the ISP front end clock's rail
            - description: the ISP front end's NOC clock
        clock-names:
          items:
            - const: int
            - const: fe
        google,wdma-context: false
        google,csis-sysreg: false
        google,ebuf: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    csis@1a440000 {
        compatible = "google,gs201-csis";
        reg = <0x1a440000 0x1000>, <0x1a4d0000 0x1000>, <0x1a4d7000 0x1000>;
        reg-names = "link", "dma", "wdma";
        interrupts = <GIC_SPI 189 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 197 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "link", "wdma";
        phys = <&csis_dcphy 0>;
        google,csis-link = <0>;
        google,wdma-context = <0>;
        google,csis-sysreg = <&sysreg_csis>;

        port {
            csis_in: endpoint {
                remote-endpoint = <&sensor_out>;
                data-lanes = <1 2 3 4>;
            };
        };
    };
