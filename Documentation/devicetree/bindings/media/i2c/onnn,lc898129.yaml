%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,lc898129.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: onsemi LC898129 camera lens autofocus and stabilisation controller

maintainers:
  - cbm <omarchy-mobile@kloot.lu>

description:
  The onsemi LC898129 is a microcontroller that drives a camera module's
  focus and optical image stabilisation actuators and holds the module's
  calibration memory, controlled over I2C with 16-bit register addresses
  and 32-bit values. It shares the module's supplies and reset with the
  image sensor, which powers it while streaming (the sensor's lens-focus
  property). It is the controller of the Google Pixel 9a's main camera
  module.

properties:
  compatible:
    const: onnn,lc898129

  reg:
    maxItems: 1

  vio-supply:
    description: Interface (1.8 V) supply.

  vm-supply:
    description: Actuator driver supply (VM).

  vdda-supply:
    description: Actuator driver analogue supply (VDDA).

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@24 {
            compatible = "onnn,lc898129";
            reg = <0x24>;
            vio-supply = <&vddio_cam>;
        };
    };
