%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/google,gs201-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 and zuma PCIe host controllers

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The PCIe controllers of the Google gs201 (Tensor G2) and zuma (Tensor G3)
  SoCs are Synopsys DesignWare cores (IP versions 0x984500 and 0x986500) in
  a Samsung wrapper. The wrapper
  adds a sub-control block (ELBI) with link training control and interrupt
  status, and an I/A sequencer that re-locks the PHY clock-data recovery when
  the link leaves L1.2. zuma's Wi-Fi controller runs without the I/A, as on
  stock. Legacy INTx interrupts are demultiplexed from the controller
  interrupt by a child interrupt controller.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - $ref: /schemas/pci/snps,dw-pcie-common.yaml#
  - if:
      properties:
        compatible:
          const: google,zuma-pcie
    then:
      properties:
        reg:
          maxItems: 3
        reg-names:
          maxItems: 3

properties:
  compatible:
    enum:
      - google,gs201-pcie
      - google,zuma-pcie

  reg:
    minItems: 3
    items:
      - description: External local bus interface (ELBI) registers
      - description: Data Bus Interface (DBI) registers, with the unrolled
          iATU at offset 0x300000
      - description: PCIe configuration space region
      - description: I/A sequencer registers

  reg-names:
    minItems: 3
    items:
      - const: elbi
      - const: dbi
      - const: config
      - const: ia

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 8

  phys:
    maxItems: 1

  phy-names:
    const: pcie

  dma-coherent: true

  samsung,cmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The HSI clock controller (CMU) of this controller. Google's driver
      turns the CMU's global automatic clock gating off before using the
      controller; the driver can do the same, and reads the PCIe gate and
      Q-channel state from it for diagnostics.

  samsung,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle of the HSI system register controller
          - description: offset of this controller's shareability register
    description:
      Needed with dma-coherent, to make the controller's DMA shareable.

  num-lanes:
    maximum: 2

  max-link-speed:
    maximum: 4

  legacy-interrupt-controller:
    type: object
    additionalProperties: false

    properties:
      "#address-cells":
        const: 0

      interrupt-controller: true

      "#interrupt-cells":
        const: 1

    required:
      - "#address-cells"
      - interrupt-controller
      - "#interrupt-cells"

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - "#interrupt-cells"
  - interrupt-map
  - interrupt-map-mask
  - phys
  - phy-names
  - reset-gpios
  - legacy-interrupt-controller

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,gs201.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        pcie@14520000 {
            compatible = "google,gs201-pcie";
            reg = <0x14520000 0x1400>, <0x14800000 0x301000>,
                  <0x60ffe000 0x2000>, <0x14500000 0x1000>;
            reg-names = "elbi", "dbi", "config", "ia";
            #address-cells = <3>;
            #size-cells = <2>;
            device_type = "pci";
            ranges = <0x82000000 0x0 0x60000000 0x60000000 0x0 0xff0000>;
            bus-range = <0x00 0xff>;
            interrupts = <GIC_SPI 428 IRQ_TYPE_LEVEL_HIGH>;
            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 7>;
            interrupt-map = <0 0 0 1 &pcie_1_intc 0>,
                            <0 0 0 2 &pcie_1_intc 1>,
                            <0 0 0 3 &pcie_1_intc 2>,
                            <0 0 0 4 &pcie_1_intc 3>;
            clocks = <&cmu_hsi2 CLK_GOUT_HSI2_PCIE_GEN4_1_PCIE_003_G4X2_DWC_PCIE_CTL_INST_0_DBI_ACLK_UG>;
            phys = <&pcie_1_phy>;
            phy-names = "pcie";
            reset-gpios = <&gph2 0 GPIO_ACTIVE_LOW>;
            samsung,cmu = <&cmu_hsi2>;
            samsung,sysreg = <&sysreg_hsi2 0x730>;
            dma-coherent;
            num-lanes = <1>;
            max-link-speed = <2>;

            pcie_1_intc: legacy-interrupt-controller {
                #address-cells = <0>;
                interrupt-controller;
                #interrupt-cells = <1>;
            };
        };
    };
