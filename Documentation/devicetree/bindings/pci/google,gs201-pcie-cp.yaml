%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/google,gs201-pcie-cp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 PCIe GEN4A_0 (modem link)

maintainers:
  - Derek Ross <derekross@gmail.com>

description: |
  PCIe GEN4A_0 in the HSI1 block of Google's gs201 (Tensor G2), a DesignWare
  root complex with two lanes that connects the Samsung S5300 modem. Its
  outbound address translation is owned by the secure monitor, which maps
  the endpoint's configuration space at the "config" window and its memory
  at a fixed window. The modem's control lines are described in a "modem"
  child node.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#

properties:
  compatible:
    const: google,gs201-pcie-cp

  reg:
    items:
      - description: sub-controller (ELBI) registers
      - description: DesignWare DBI registers
      - description: endpoint configuration space window
      - description: I/A sequencer registers

  reg-names:
    items:
      - const: elbi
      - const: dbi
      - const: config
      - const: ia

  interrupts:
    items:
      - description: controller events
      - description: MSI block 0
      - description: MSI block 1
      - description: MSI block 2
      - description: MSI block 3
      - description: MSI block 4

  interrupt-names:
    items:
      - const: ctrl
      - const: msi0
      - const: msi1
      - const: msi2
      - const: msi3
      - const: msi4

  phys:
    maxItems: 1

  phy-names:
    const: pcie

  pinctrl-0: true
  pinctrl-names:
    const: active

  reset-gpios:
    maxItems: 1
    description: PERST#

  num-lanes:
    const: 2

  max-link-speed:
    const: 3

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: PMU
          - description: offset of the PHY isolation control register
    description:
      PMU and the PHY isolation control register. The PHY driver releases
      isolation; this controller sets it again once the link is down.

  memory-region:
    maxItems: 1
    description:
      The modem's MSI target page. The DesignWare MSI block terminates the
      MSI writes to it; the modem also writes its boot stage into the page,
      so it must be reserved RAM.

  samsung,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: HSI1 system registers
          - description: offset of the shareability control register
    description: SYSREG_HSI1 and its PCIe shareability (I/O coherency) register.

  modem:
    type: object
    additionalProperties: false
    description:
      The modem's power, reset and handshake lines (raw levels), for
      driving the modem without its own driver. When the modem driver
      describes the lines in its own node instead, this node is absent or
      disabled, so that each line has one owner.
    properties:
      compatible:
        const: samsung,s5300-modem
      status: true
      ap2cp-pda-active-gpios:
        maxItems: 1
      ap2cp-cp-pwr-on-gpios:
        maxItems: 1
      ap2cp-nreset-gpios:
        maxItems: 1
      ap2cp-cp-wrst-gpios:
        maxItems: 1
      ap2cp-pm-wrst-gpios:
        maxItems: 1
      ap2cp-wakeup-gpios:
        maxItems: 1
      ap2cp-dump-noti-gpios:
        maxItems: 1
      cp2ap-cp-wrst-gpios:
        maxItems: 1
      cp2ap-ps-hold-gpios:
        maxItems: 1
      cp2ap-wakeup-gpios:
        maxItems: 1
      cp2ap-phone-active-gpios:
        maxItems: 1
    required:
      - compatible
      - ap2cp-pda-active-gpios
      - ap2cp-cp-pwr-on-gpios
      - ap2cp-nreset-gpios
      - ap2cp-cp-wrst-gpios
      - ap2cp-pm-wrst-gpios
      - ap2cp-wakeup-gpios
      - ap2cp-dump-noti-gpios
      - cp2ap-cp-wrst-gpios
      - cp2ap-ps-hold-gpios
      - cp2ap-wakeup-gpios
      - cp2ap-phone-active-gpios

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - phys
  - reset-gpios
  - samsung,pmu-syscon
  - samsung,sysreg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    pcie@11920000 {
        compatible = "google,gs201-pcie-cp";
        #address-cells = <3>;
        #size-cells = <2>;
        device_type = "pci";
        ranges = <0x82000000 0x0 0x14e00000 0x40000000 0x0 0xff0000>;
        bus-range = <0x00 0xff>;
        reg = <0x11920000 0x1400>, <0x11c00000 0x301000>,
              <0x40ffe000 0x2000>, <0x11900000 0x1000>;
        reg-names = "elbi", "dbi", "config", "ia";
        interrupts = <GIC_SPI 388 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 389 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 390 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 391 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 392 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 393 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "ctrl", "msi0", "msi1", "msi2", "msi3", "msi4";
        phys = <&pcie_0_phy>;
        phy-names = "pcie";
        memory-region = <&cp_msi_mem>;
        reset-gpios = <&gph0 0 GPIO_ACTIVE_LOW>;
        samsung,pmu-syscon = <&pmu_system_controller 0x3ec0>;
        samsung,sysreg = <&sysreg_hsi1 0x704>;
        num-lanes = <2>;
        max-link-speed = <3>;

        modem {
            compatible = "samsung,s5300-modem";
            ap2cp-pda-active-gpios = <&gph1 1 GPIO_ACTIVE_HIGH>;
            ap2cp-cp-pwr-on-gpios = <&gph1 2 GPIO_ACTIVE_HIGH>;
            ap2cp-nreset-gpios = <&gph1 3 GPIO_ACTIVE_HIGH>;
            ap2cp-cp-wrst-gpios = <&gph1 6 GPIO_ACTIVE_HIGH>;
            ap2cp-pm-wrst-gpios = <&gpa0 3 GPIO_ACTIVE_HIGH>;
            ap2cp-wakeup-gpios = <&gph0 2 GPIO_ACTIVE_HIGH>;
            ap2cp-dump-noti-gpios = <&gph0 3 GPIO_ACTIVE_HIGH>;
            cp2ap-cp-wrst-gpios = <&gpa0 2 GPIO_ACTIVE_HIGH>;
            cp2ap-ps-hold-gpios = <&gpa8 2 GPIO_ACTIVE_HIGH>;
            cp2ap-wakeup-gpios = <&gpa8 3 GPIO_ACTIVE_HIGH>;
            cp2ap-phone-active-gpios = <&gpa8 4 GPIO_ACTIVE_HIGH>;
        };
    };
