%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/google,zumapro-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google zumapro (Tensor G4) PCIe host controller

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description:
  The second PCIe channel (channel 1) of the Google zumapro (Tensor G4) SoC,
  one lane in the HSI2 block, is a Synopsys DesignWare core in a Samsung
  wrapper. The wrapper adds an external local bus interface (ELBI) with link
  training control and status, a sub-system control block, the PHY's debug
  (UDBG), PMA and PCS register blocks, and an I/A sequencer. The PHY sits
  behind an isolation switch in the PMU, which has to be opened before any
  of these registers is accessed. MSIs are received by the
  DesignWare core's own MSI controller and signalled on five interrupt
  lines, one per group of 32 vectors.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#

properties:
  compatible:
    const: google,zumapro-pcie

  reg:
    items:
      - description: External local bus interface (ELBI) registers
      - description: Sub-system control registers
      - description: PHY debug (UDBG) registers
      - description: PHY PMA registers
      - description: PHY PCS registers
      - description: I/A sequencer registers
      - description: Data Bus Interface (DBI) registers, with the unrolled
          iATU at offset 0x300000
      - description: PCIe configuration space region

  reg-names:
    items:
      - const: elbi
      - const: soc
      - const: udbg
      - const: phy
      - const: pcs
      - const: ia
      - const: dbi
      - const: config

  interrupts:
    items:
      - description: Controller interrupt
      - description: MSI vectors 0 to 31
      - description: MSI vectors 32 to 63
      - description: MSI vectors 64 to 95
      - description: MSI vectors 96 to 127
      - description: MSI vectors 128 to 159

  interrupt-names:
    items:
      - const: ctrl
      - const: msi0
      - const: msi1
      - const: msi2
      - const: msi3
      - const: msi4

  clocks:
    items:
      - description: Controller APB clock
      - description: DBI AXI clock
      - description: AXI slave clock
      - description: AXI master clock
      - description: PHY UDBG APB clock
      - description: PHY PAL APB clock
      - description: PHY reference clock
      - description: PHY bridge APB clock
      - description: PHY test APB clock
      - description: I/A sequencer clock
      - description: I/A SSMT AXI clock
      - description: I/A SSMT APB clock
      - description: System MMU clock
      - description: PMMU clock

  clock-names:
    items:
      - const: ctl-apb
      - const: dbi-aclk
      - const: slv-aclk
      - const: mstr-aclk
      - const: phy-udbg-apb
      - const: phy-pal-apb
      - const: phy-ref
      - const: phy-bridge-apb
      - const: phy-test-apb
      - const: ia-clk
      - const: ssmt-ia-aclk
      - const: ssmt-ia-pclk
      - const: sysmmu-clk
      - const: pmmu-clk

  reset-gpios:
    description: PERST# of the endpoint.
    maxItems: 1

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle of the PMU system controller
          - description: offset of the PCIe PHY control register
    description:
      The PMU register that isolates the PCIe PHY. Bit 0 opens the isolation,
      bit 10 is set once the PHY is configured.

  num-lanes:
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - reset-gpios
  - samsung,pmu-syscon

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,zumapro.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <1>;

        pcie@13120000 {
            compatible = "google,zumapro-pcie";
            reg = <0x0 0x13120000 0x2000>, <0x0 0x13130000 0x5000>,
                  <0x0 0x13150000 0xd000>, <0x0 0x13160000 0x3000>,
                  <0x0 0x13140000 0x5000>, <0x0 0x13100000 0x1000>,
                  <0x0 0x13400000 0x381000>, <0x0 0x60ffe000 0x2000>;
            reg-names = "elbi", "soc", "udbg", "phy", "pcs", "ia", "dbi",
                        "config";
            #address-cells = <3>;
            #size-cells = <2>;
            device_type = "pci";
            ranges = <0x82000000 0x0 0x60000000 0x0 0x60000000 0x0 0xff0000>;
            bus-range = <0x00 0xff>;
            interrupts = <GIC_SPI 439 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 441 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 442 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 443 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 444 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 445 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "ctrl", "msi0", "msi1", "msi2", "msi3", "msi4";
            clocks = <&cmu_hsi2 CLK_GOUT_PCIE1_CTL_APB>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_DBI_ACLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_SLV_ACLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_MSTR_ACLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_PHY_UDBG_APB>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_PHY_PAL_APB>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_PHY_REF>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_PHY_BRIDGE_APB>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_PHY_TEST_APB>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_IA_CLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_SSMT_IA_ACLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_SSMT_IA_PCLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_SYSMMU_CLK>,
                     <&cmu_hsi2 CLK_GOUT_PCIE1_PMMU_CLK>;
            clock-names = "ctl-apb", "dbi-aclk", "slv-aclk", "mstr-aclk",
                          "phy-udbg-apb", "phy-pal-apb", "phy-ref",
                          "phy-bridge-apb", "phy-test-apb", "ia-clk",
                          "ssmt-ia-aclk", "ssmt-ia-pclk", "sysmmu-clk",
                          "pmmu-clk";
            reset-gpios = <&gph3 0 GPIO_ACTIVE_LOW>;
            samsung,pmu-syscon = <&pmu_system_controller 0x3ec8>;
            num-lanes = <1>;
            max-link-speed = <2>;

            pcie@0,0 {
                compatible = "pciclass,0604";
                reg = <0x0 0x0 0x0 0x0 0x0>;
                #address-cells = <3>;
                #size-cells = <2>;
                device_type = "pci";
                bus-range = <0x01 0xff>;
                ranges;
                vpcie3v3-supply = <&wlan_reg_on>;
            };
        };
    };
