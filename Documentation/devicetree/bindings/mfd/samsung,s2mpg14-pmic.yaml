%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mpg14-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG14 Power Management IC

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  S2MPG14 is the main PMIC paired with Google's Tensor G3 and Tensor G4.
  Its LDO4M and LDO25M outputs supply the analog and digital touchscreen
  power rails.

properties:
  compatible:
    const: samsung,s2mpg14-pmic

  gpio:
    type: object
    description:
      The PMIC's six general purpose pins. On the Pixel 9a one switches
      the main camera's digital supply.

    properties:
      compatible:
        const: samsung,s2mpg14-gpio

      gpio-controller: true

      '#gpio-cells':
        const: 2

      gpio-line-names:
        maxItems: 6

    required:
      - compatible
      - gpio-controller
      - '#gpio-cells'

    additionalProperties: false

  regulators:
    type: object
    $ref: /schemas/regulator/samsung,s2mpg14-regulator.yaml

required:
  - compatible
  - regulators

additionalProperties: false

examples:
  - |
    pmic-1 {
        compatible = "samsung,s2mpg14-pmic";

        gpio {
            compatible = "samsung,s2mpg14-gpio";
            gpio-controller;
            #gpio-cells = <2>;
        };

        regulators {
            ldo4m {
                regulator-name = "touch-avdd";
            };

            ldo25m {
                regulator-name = "touch-vdd";
            };
        };
    };
