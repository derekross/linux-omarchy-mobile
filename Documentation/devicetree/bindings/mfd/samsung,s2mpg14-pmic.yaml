%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mpg14-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG14 Power Management IC

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  S2MPG14 is the main PMIC paired with Google's Tensor G3 and Tensor G4.
  Its LDO4M and LDO25M outputs supply the analog and digital touchscreen
  power rails.

properties:
  compatible:
    const: samsung,s2mpg14-pmic

  regulators:
    type: object
    $ref: /schemas/regulator/samsung,s2mpg14-regulator.yaml

required:
  - compatible
  - regulators

additionalProperties: false

examples:
  - |
    pmic-1 {
        compatible = "samsung,s2mpg14-pmic";

        regulators {
            ldo4m {
                regulator-name = "touch-avdd";
            };

            ldo25m {
                regulator-name = "touch-vdd";
            };
        };
    };
