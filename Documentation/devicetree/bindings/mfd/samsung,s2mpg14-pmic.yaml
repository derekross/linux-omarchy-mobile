%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mpg14-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG14 Power Management IC

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  S2MPG14 is the main PMIC paired with Google's Tensor G4. Its LDO4M and
  LDO25M outputs supply the analog and digital touchscreen power rails.

  It has no interrupt line of its own: it reports events in-band, and the
  SoC's VGPIO2AP system registers turn them into one level interrupt with a
  pending latch that the host acknowledges, as for the S2MPG12.

properties:
  compatible:
    const: samsung,s2mpg14-pmic

  interrupts:
    maxItems: 1

  google,vgpio2ap-sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the VGPIO2AP system registers, which latch the PMIC's
      in-band interrupt.

  wakeup-source: true

  regulators:
    type: object
    $ref: /schemas/regulator/samsung,s2mpg14-regulator.yaml

required:
  - compatible
  - interrupts
  - google,vgpio2ap-sysreg
  - regulators

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic-1 {
        compatible = "samsung,s2mpg14-pmic";
        interrupts = <GIC_SPI 74 IRQ_TYPE_LEVEL_HIGH>;
        google,vgpio2ap-sysreg = <&sysreg_vgpio2ap>;
        wakeup-source;

        regulators {
            ldo4m {
                regulator-name = "touch-avdd";
            };

            ldo25m {
                regulator-name = "touch-vdd";
            };
        };
    };
