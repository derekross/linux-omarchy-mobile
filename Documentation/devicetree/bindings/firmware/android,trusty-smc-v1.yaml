%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/android,trusty-smc-v1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Trusty secure OS

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  Trusty is a secure OS that runs alongside Linux in the secure world and is
  reached through SMC calls. The node describes the interface to an already
  running Trusty; its children are the services that ride on it.

properties:
  compatible:
    const: android,trusty-smc-v1

  irq:
    type: object
    additionalProperties: false
    description:
      Forwarding of the interrupts Trusty asks for. Trusty reports the
      interrupt numbers it uses; those in ipi-range are inter-processor
      interrupts, mapped onto GIC SGIs.
    properties:
      compatible:
        const: android,trusty-irq-v1
      ipi-range:
        $ref: /schemas/types.yaml#/definitions/uint32-array
        description:
          First and last Trusty IPI number, and the GIC SGI the first one
          maps to.
        items:
          - description: first Trusty IPI number
          - description: last Trusty IPI number
          - description: GIC SGI of the first one
    required:
      - compatible

  log:
    type: object
    additionalProperties: false
    description: Trusty's log, copied into the kernel log.
    properties:
      compatible:
        const: android,trusty-log-v1
    required:
      - compatible

  virtio:
    type: object
    additionalProperties: false
    description:
      The virtio devices Trusty exposes, among them the IPC device used to
      reach trusted applications.
    properties:
      compatible:
        const: android,trusty-virtio-v1
    required:
      - compatible

required:
  - compatible

additionalProperties: false

examples:
  - |
    trusty {
        compatible = "android,trusty-smc-v1";

        irq {
            compatible = "android,trusty-irq-v1";
            ipi-range = <8 15 8>;
        };

        log {
            compatible = "android,trusty-log-v1";
        };

        virtio {
            compatible = "android,trusty-virtio-v1";
        };
    };
