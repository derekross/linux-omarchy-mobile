%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpg14-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG14 Power Management IC regulators

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  S2MPG14 provides programmable voltage outputs. LDO4M and LDO25M supply
  touchscreen power; LDO8M, LDO9M and LDO19M supply eUSB2 PHY and repeater
  power on the Pixel 9a.

patternProperties:
  "^ldo(4|8|9|19|25)m$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    properties:
      regulator-ramp-delay: false

additionalProperties: false
