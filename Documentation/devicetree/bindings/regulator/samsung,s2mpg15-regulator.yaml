%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpg15-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG15 Power Management IC regulators

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  The sub-PMIC paired with Google's Tensor G4. LDO5S and LDO7S supply the
  AoC sensors, LDO12S the camera sensors' 1.8 V and LDO15S the fingerprint
  sensor's 3.3 V. Enable control and voltage readback are supported; the
  firmware's voltage selections are preserved.

patternProperties:
  "^ldo(5|7|9|10|11|12|15)s$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    properties:
      regulator-ramp-delay: false

additionalProperties: false
