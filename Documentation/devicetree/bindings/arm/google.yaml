%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/google.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor platforms

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

description: |
  ARM platforms using SoCs designed by Google branded "Tensor" used in Pixel
  devices.

  Currently upstream this is devices using "gs101" SoC which is found in Pixel
  6, Pixel 6 Pro and Pixel 6a.

  Google have a few different names for the SoC:
  - Marketing name ("Tensor")
  - Codename ("Whitechapel")
  - SoC ID ("gs101")
  - Die ID ("S5P9845")

  Likewise there are a couple of names for the actual device
  - Marketing name ("Pixel 6")
  - Codename ("Oriole")

  Devicetrees should use the lowercased SoC ID and lowercased board codename,
  e.g. gs101 and gs101-oriole.

properties:
  $nodename:
    const: '/'
  compatible:
    oneOf:
      - description: Google Pixel 6 or 6 Pro (Oriole or Raven)
        items:
          - enum:
              - google,gs101-oriole
              - google,gs101-raven
          - const: google,gs101
      - description: Google Tensor G2 (GS201) boards
        items:
          - enum:
              - google,gs201-cheetah
              - google,gs201-felix
              - google,gs201-lynx
          - const: google,gs201
      - description: Google Tensor G3 (zuma) boards
        items:
          - enum:
              - google,zuma-husky
          - const: google,zuma

  # Bootloader requires an ect node to be present: empty on gs101 and gs201,
  # with the location of the ECT blob on zuma
  ect:
    type: object
    additionalProperties: false
    properties:
      parameter_address:
        $ref: /schemas/types.yaml#/definitions/uint32
        description:
          Physical address of the Exynos Characteristic Table (ECT), the
          bootloader-provided table of clock, voltage and timing parameters.
      parameter_size:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Size of the ECT in bytes.

  soc_compatible:
    type: object
    description:
      Bootloaders that match on this node rather than /soc_id (zuma's, and
      the Pixel 7a's) pick the base DTB by matching the SoC's product id,
      revision and package against these children, one per supported
      silicon revision and package.
    additionalProperties:
      type: object
      # Stock trees also give each child a human-readable label in a
      # property named "description", which a schema cannot name.
      additionalProperties: true
      properties:
        product_id:
          $ref: /schemas/types.yaml#/definitions/uint32
        major:
          $ref: /schemas/types.yaml#/definitions/uint32
        minor:
          $ref: /schemas/types.yaml#/definitions/uint32
        pkg_mode:
          $ref: /schemas/types.yaml#/definitions/uint32
      required:
        - product_id
        - major
        - minor
        - pkg_mode

required:
  - ect

allOf:
  - if:
      properties:
        compatible:
          not:
            contains:
              const: google,zuma
    then:
      properties:
        ect:
          properties:
            parameter_address: false
            parameter_size: false

additionalProperties: true

...
