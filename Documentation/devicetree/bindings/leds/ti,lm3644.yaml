%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/ti,lm3644.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments LM3644 dual-channel flash LED driver

maintainers:
  - Derek Ross <derekross@gmail.com>

description: |
  The LM3644 and LM3644TT are I2C-controlled flash LED drivers with a
  boost converter and two current sinks (LED1, LED2), each capable of up to
  1.5 A in flash mode and of a lower continuous torch current. The chip is
  held in shutdown while its HWEN pin is low. The variants differ in torch
  current resolution and are told apart by the device ID register.

properties:
  compatible:
    const: ti,lm3644

  reg:
    maxItems: 1

  enable-gpios:
    maxItems: 1
    description: GPIO connected to the HWEN pin.

  strobe-gpios:
    maxItems: 1
    description: |
      GPIO connected to the active-high STROBE pin. When supplied, the
      torch-only driver holds it low to prevent external flash triggering.

  led:
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      led-sources:
        minItems: 1
        maxItems: 2
        items:
          enum: [1, 2]
        description: Current sinks driving this LED, LED1 = 1, LED2 = 2.

      led-max-microamp:
        description: Torch current limit per current sink.
        minimum: 977
        maximum: 372000

    required:
      - led-sources
      - led-max-microamp

required:
  - compatible
  - reg
  - enable-gpios
  - led

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      led-controller@63 {
        compatible = "ti,lm3644";
        reg = <0x63>;
        enable-gpios = <&gpio 2 GPIO_ACTIVE_HIGH>;

        led {
          function = LED_FUNCTION_TORCH;
          color = <LED_COLOR_ID_WHITE>;
          led-sources = <1 2>;
          led-max-microamp = <50000>;
        };
      };
    };
