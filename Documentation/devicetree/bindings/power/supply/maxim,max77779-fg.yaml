%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max77779-fg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77779 fuel gauge

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description:
  Fuel-gauge measurements from a MAX77779 with an initialized battery model.
  Firmware retains responsibility for model programming and charger control.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: maxim,max77779-fg

  reg:
    maxItems: 1

  shunt-resistor-micro-ohms:
    description: Resistance of the battery current sense resistor in micro-ohms.
    minimum: 100
    maximum: 100000

required:
  - compatible
  - reg
  - shunt-resistor-micro-ohms

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        fuel-gauge@36 {
            compatible = "maxim,max77779-fg";
            reg = <0x36>;
            shunt-resistor-micro-ohms = <2000>;
        };
    };
