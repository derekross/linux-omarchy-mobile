%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,ea8074.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung EA8074 AMOLED panel

maintainers:
  - quatrixone <quatrix1@gmail.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,ea8074

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vci-supply:
    description: VCI regulator

  vddio-supply:
    description: VDDIO regulator

  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vci-supply
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,ea8074";
            reg = <0>;
            reset-gpios = <&tlmm 6 GPIO_ACTIVE_LOW>;
            vci-supply = <&vreg_panel_vci>;
            vddio-supply = <&vreg_tp_vddio>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
