%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e3hc4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6E3HC4 AMOLED DSI panel

description:
  The S6E3HC4 is a display driver IC from Samsung Mobile Display, driving
  the 1440x3120 command-mode AMOLED panel of the Google Pixel 7 Pro. The
  panel takes DSC-compressed pixel data over four MIPI DSI lanes and
  reports its refresh timing on a tearing effect (TE) line.

maintainers:
  - Derek Ross <derekross@gmail.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - samsung,s6e3hc3
      - samsung,s6e3hc4

  reg:
    maxItems: 1

  reset-gpios: true

  vddi-supply:
    description: I/O supply (1.8 V)

  vddd-supply:
    description: Digital core supply (1.125 V)

  vci-supply:
    description: Analog supply (3.0 V)

required:
  - compatible
  - reg

if:
  properties:
    compatible:
      contains:
        const: samsung,s6e3hc4
then:
  required:
    - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e3hc4";
            reg = <0>;
            reset-gpios = <&gpa7 1 GPIO_ACTIVE_LOW>;
            vddi-supply = <&vddi>;
            vddd-supply = <&vddd>;
            vci-supply = <&vci>;
            width-mm = <71>;
            height-mm = <155>;
        };
    };

...
