%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/google,gs201-dsim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 MIPI DSI master (DSIM)

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The DSIM is the MIPI DSI master of the gs201 (Tensor G2) display
  pipeline. It takes pixel data from a DECON and drives up to four data
  lanes through a combined D-PHY/C-PHY, in video or command mode, with
  DSC slice packing and TE-based command scheduling. Panels are described
  as child nodes.

allOf:
  - $ref: /schemas/display/dsi-controller.yaml#

properties:
  compatible:
    oneOf:
      - const: google,gs201-dsim
      - items:
          - enum:
              - google,gs101-dsim
          - const: google,gs201-dsim

  reg:
    minItems: 1
    items:
      - description: DSIM link registers
      - description: D-PHY lane registers
      - description: D-PHY common registers

  reg-names:
    minItems: 1
    items:
      - const: dsi
      - const: dphy
      - const: dphy-extra

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      Input from the DECON.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/gpio/gpio.h>

    dsi@1c2c0000 {
        compatible = "google,gs201-dsim";
        reg = <0x1c2c0000 0x300>, <0x1c2e0100 0x700>, <0x1c2e0000 0x100>;
        reg-names = "dsi", "dphy", "dphy-extra";
        interrupts = <GIC_SPI 250 IRQ_TYPE_LEVEL_HIGH>;
        #address-cells = <1>;
        #size-cells = <0>;

        port {
            dsi0_in: endpoint {
                remote-endpoint = <&decon0_out>;
            };
        };

        panel@0 {
            compatible = "samsung,s6e3hc4";
            reg = <0>;
            reset-gpios = <&gpa7 1 GPIO_ACTIVE_LOW>;
        };
    };

...
