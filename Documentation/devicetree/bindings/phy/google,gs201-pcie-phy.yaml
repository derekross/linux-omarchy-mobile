%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,gs201-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 PCIe PHY

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The PCIe Gen4 PHY of the Google gs201 (Tensor G2) SoC. Each instance is a
  two-lane Samsung PHY with its PMA and PCS register blocks, a debug block
  that selects the reference clock, and three reset lines that live in the
  sub-control space of the PCIe controller it serves. Its isolation is
  controlled from the PMU.

properties:
  compatible:
    const: google,gs201-pcie-phy

  reg:
    items:
      - description: PMA registers
      - description: PCS registers
      - description: PHY reset registers in the controller's sub-control space
      - description: UDBG (reference clock and PLL selection) registers

  reg-names:
    items:
      - const: pma
      - const: pcs
      - const: rst
      - const: udbg

  clocks:
    minItems: 1
    maxItems: 5

  "#phy-cells":
    const: 0

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle of the PMU system controller
          - description: offset of this PHY's control (isolation) register
    description:
      The PMU and the offset of PHY_CTRL_PCIE_GEN4_x for this instance.

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"
  - samsung,pmu-syscon

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,gs201.h>

    phy@14550000 {
        compatible = "google,gs201-pcie-phy";
        reg = <0x14550000 0x2000>, <0x14540000 0x1000>,
              <0x14521400 0x10>, <0x14560000 0xd000>;
        reg-names = "pma", "pcs", "rst", "udbg";
        clocks = <&cmu_hsi2 CLK_GOUT_HSI2_PCIE_GEN4_1_PCS_PMA_INST_0_PHY_UDBG_I_APB_PCLK>;
        samsung,pmu-syscon = <&pmu_system_controller 0x3ec4>;
        #phy-cells = <0>;
    };
