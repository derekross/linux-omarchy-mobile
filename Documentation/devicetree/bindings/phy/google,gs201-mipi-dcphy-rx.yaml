%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/google,gs201-mipi-dcphy-rx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 and zumapro MIPI DC-PHY receiver

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The receive side of the Samsung MIPI DC-PHY in the camera block of Google's
  gs201 SoC, one combined D-PHY/C-PHY slave per CSIS link (links 0 and 1 with
  four data lanes, links 2-7 with two; links 2, 4 and 6 can take the next
  link's two data lanes as a four-lane receiver), a shared bias block and
  one PMU isolation control. The PHY cell selects the link. Each slave
  receives D-PHY or C-PHY (up to three trios on links 0 and 1, two on the
  others); the consumer selects the mode at run time, from its endpoint's
  bus type. zumapro (Tensor G4) has nine slaves for twelve CSIS links, the
  clock lane first on each, and one reset bit per slave; the PHY cell is
  the CSIS link.

properties:
  compatible:
    enum:
      - google,gs201-mipi-dcphy-rx
      - google,zumapro-mipi-dcphy-rx

  reg:
    maxItems: 1

  "#phy-cells":
    const: 1

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: PMU system controller
          - description: offset of the PHY isolation control
    description: The PMU register that releases the PHY from isolation.

  google,reset-sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: the camera block's system registers
          - description: offset of the per-slave reset register (bit = slave)
    description:
      The register that holds each DC-PHY slave in reset (bit clear) or
      releases it (bit set).

  firmware-name:
    maxItems: 1
    description:
      The receive settings for D-PHY and C-PHY (bias and per-lane analog
      words, the HS settle count and skew delay by rate), which aren't
      public, as a data file loaded when a link first powers on. Without
      it no link powers on.

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - "#phy-cells"
  - samsung,pmu-syscon
  - firmware-name

additionalProperties: false

examples:
  - |
    phy@1a4f0000 {
        compatible = "google,gs201-mipi-dcphy-rx";
        reg = <0x1a4f0000 0x4000>;
        #phy-cells = <1>;
        samsung,pmu-syscon = <&pmu_system_controller 0x3ebc>;
        google,reset-sysreg = <&sysreg_csis 0x500>;
        firmware-name = "gs201-dcphy.bin";
    };
