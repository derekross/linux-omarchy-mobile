%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/maxim,max77779-sgpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim Integrated MAX77779 SGPIO

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  This module is part of the MAX77779 PMIC block. For additional
  information, see
  Documentation/devicetree/bindings/mfd/maxim,max77779-pmic.yaml.

  The SGPIO controller has eight lines with interrupt support. It
  interrupts through the SGPIO source of the PMIC block's interrupt
  controller and is the interrupt controller for its own lines: its
  interrupt cells number the lines, 0 to 7.

properties:
  compatible:
    const: maxim,max77779-sgpio

  "#gpio-cells":
    const: 2

  gpio-controller: true

  gpio-line-names:
    minItems: 1
    maxItems: 8

  "#interrupt-cells":
    const: 2

  interrupt-controller: true

required:
  - compatible
  - "#gpio-cells"
  - gpio-controller
  - "#interrupt-cells"
  - interrupt-controller

additionalProperties: false
