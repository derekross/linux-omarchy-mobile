%YAML 1.2
---
$id: http://devicetree.org/schemas/hwmon/samsung,s2mpg12-meter.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG12/S2MPG13 PMIC power meter

maintainers:
  - Derek Ross <derekross@gmail.com>

description: |
  The S2MPG12 and S2MPG13 PMICs, paired with Google's gs201 SoC, each have
  twelve power meter channels. A channel measures the power of one of the
  PMIC's own bucks or LDOs, or, through the VSEN_C pins, the power drawn
  through an external shunt resistor.

  This node is a child of the PMIC node, see
  Documentation/devicetree/bindings/mfd/samsung,s2mpg12-pmic.yaml and
  samsung,s2mpg13-pmic.yaml.

properties:
  compatible:
    enum:
      - samsung,s2mpg12-meter
      - samsung,s2mpg13-meter

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^channel@[0-9ab]$":
    type: object
    description: One meter channel.

    properties:
      reg:
        description: The meter channel.
        maximum: 11

      samsung,source:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: |
          Input of the channel's multiplexer: 0x01-0x0a for BUCK1-BUCK10,
          on S2MPG13 also 0x0b (BUCKD), 0x0c (BUCKA), 0x0d (BUCKC) and
          0x10 (buck-boost); 0x20 + n for LDOn (n = 1-28); 0x5c-0x5e for
          the external shunts on VSEN_C1-VSEN_C3 (S2MPG12) or VSEN_C4-VSEN_C6
          (S2MPG13).
        enum: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0a,
               0x0b, 0x0c, 0x0d, 0x10,
               0x21, 0x22, 0x23, 0x24, 0x25, 0x26, 0x27, 0x28, 0x29, 0x2a,
               0x2b, 0x2c, 0x2d, 0x2e, 0x2f, 0x30, 0x31, 0x32, 0x33, 0x34,
               0x35, 0x36, 0x37, 0x38, 0x39, 0x3a, 0x3b, 0x3c,
               0x5c, 0x5d, 0x5e]

      label:
        description: Name of the measured rail.

      shunt-resistor-micro-ohms:
        description:
          The shunt resistor of an external channel (samsung,source
          0x5c-0x5e). At least 1000.
        minimum: 1000

    required:
      - reg
      - samsung,source

    allOf:
      - if:
          properties:
            samsung,source:
              enum: [0x5c, 0x5d, 0x5e]
        then:
          required:
            - shunt-resistor-micro-ohms
        else:
          properties:
            shunt-resistor-micro-ohms: false

    additionalProperties: false

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    power-meter {
        compatible = "samsung,s2mpg13-meter";
        #address-cells = <1>;
        #size-cells = <0>;

        channel@0 {
            reg = <0>;
            samsung,source = <0x5c>;
            label = "VSYS_PWR_DISPLAY";
            shunt-resistor-micro-ohms = <10000>;
        };

        channel@4 {
            reg = <4>;
            samsung,source = <0x02>;
            label = "S2S_VDD_G3D";
        };
    };
