%YAML 1.2
---
$id: http://devicetree.org/schemas/iommu/google,gs201-pcie-sysmmu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google gs201 PCIe System MMU used as a DMA window

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The Samsung System MMU (version 8.1) in front of the gs201 PCIe GEN4A_1
  controller. It is programmed with a 1:1 mapping of one reserved memory
  region, so the PCIe device can reach that region and nothing else.

properties:
  compatible:
    const: google,gs201-pcie-sysmmu

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 2

  google,dma-window:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The reserved memory region (typically the PCIe device's
      restricted-dma-pool) that is the only memory the PCIe device may
      access. Not memory-region, which would make the pool this node's own
      DMA bounce buffer, placing the page table inside the window.

  google,vid:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 7
    default: 1
    description:
      The System MMU virtual ID translated by default (stock uses 1). No
      kernel code assigns the controller's VID, so this must be confirmed with
      a negative test.

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    sysmmu@145c0000 {
        compatible = "google,gs201-pcie-sysmmu";
        reg = <0x145c0000 0x10000>;
        interrupts = <GIC_SPI 446 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cmu_hsi2 17>, <&cmu_hsi2 55>;
        google,vid = <1>;
    };
